<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const user={
            name:"Ashish",
            greet(){
                setTimeout(function (){
                 console.log(this.name); //Undefined (Lost context in normal function of setTimeout because because "this" refer to window 'this' key in normal fun)
                },0)
            }
        }

        const user2={
            name:"Ashish",
            greet(){
                setTimeout(()=>{
                 console.log(this.name); // in arrow function it follows lexical behaviour
                },0)
            }
        }
        user2.greet()
    </script>
</body>
</html>
