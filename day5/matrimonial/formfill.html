<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormDetails</title>
</head>

<body>
    <fieldset>
        <legend>Your Personal Details</legend>
        <form action="./successfulpage.html">
            <label for="name">Your full name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>
            <label for="occupation">Occupation:</label>
            <input type="text" id="occupation" name="occupation" placeholder="Enter your occupation" required><br><br>
            <label for="phoneNum">Phone Number:</label>
            <input type="text" id="phoneNum" name="phoneNum" placeholder="Enter your phone number"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"><br><br>
            <label for="gender">Gender:</label>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female"> <br> <br>
            <label for="password">Password</label>
            <input type="password" minlength="8" name="password" id="password"> <br> <br>

            <label for="img">Upload Image:</label>
            <input type="file" id="img" name="img"><br> <br>

            <label for="hobbies">Hobbies:</label>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="travel" name="hobbies" value="traveling">
            <label for="travel">Traveling</label>
            <input type="checkbox" id="badminton" name="hobbies" value="badminton">
            <label for="badminton">Badminton</label> <br> <br>

            <label for="alcohol">Alcohol Consumption:</label>
            <select name="alcohol" id="alcohol">
                <option value="never">Never</option>
                <option value="occasionally">Occassionally</option>
                <option value="regularly">Regularly</option>
                <option value="ghodamadua">Ghodamadua</option>
            </select> <br> <br>
            <button type="submit">Submit</button>
        </form>
    </fieldset>
</body>

</html>
