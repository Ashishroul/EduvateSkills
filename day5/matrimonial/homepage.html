<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrimonial</title>
    <style>
        label{
            color: white;
        }
        select,button{
            padding: 8px 40px;
            border-radius: 5px;
        }
        button{
            background-color:aqua;
            border: none;
        }
    </style>
</head>
<body style="padding: 20px 50px;">
    <div align="center" style="border-radius: 10px; padding: 10px; background-image: url('https://archive.siasat.com/wp-content/uploads/2022/01/MarriageJan23.jpg'); background-size: cover; height: 450px;">
        
            <form action="./formfill.html" style="padding: 10px; background-color:#00000075; border-radius: 10px; width:60%;">
                <label for="">I am looking for a:</label> <br>
                <label for="gender">Gender:</label>
                <select name="gender" id="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <label for="age">Age:</label>
                <select name="age" id="age">
                    <option value="18-25">18-25</option>
                    <option value="26-35">26-35</option>
                    <option value="36-45">36-45</option>
                </select>
                <label for="religion">Religion:</label>
                <select name="religion" id="religion">
                    <option value="hindu">Hindu</option>
                    <option value="jain">Jain</option>
                    <option value="muslim">Muslim</option>
                    <option value="christian">Christian</option>
                    <option value="sikh">Sikh</option>
                </select>
                <button type="submit">Let's Begin</button>
            </form>
       
    </div>
</body>
</html>
