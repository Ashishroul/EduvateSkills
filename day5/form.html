<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <fieldset>
        <legend>User personal information</legend>
        <form action="./successfullpage.html">
            <label for="name">Enter your name</label> <br>
            <input type="text" id="name" name="name"><br>
            <label for="email">Enter your email</label><br>
            <input type="email" id="email" name="email"><br>
            <label for="Password">Enter your Password</label><br>
            <input minlength="8" type="password" id="Password" name="Password"><br>
            <label for="confirmpassword">Confirm your Password</label><br>
            <input minlength="8" type="password" id="confirmpassword" name="confirmpassword"><br>

            <label for="gender">Enter your gender</label><br>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female">
            <label for="others">Others</label>
            <input type="radio" name="gender" id="others"><br>

            <label for="Dob">Enter Your Date of Birth</label>
            <input type="date" id="Dob" name="Dob"><br>
            <label for="address">Enter your address</label><br>
            <input type="text" id="address" name="address"><br>
            <button type="submit">Submit</button>

        </form>
    </fieldset>
</body>

</html>
