<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTPmethods</title>
</head>

<body>
    <script>
        // HTTP get method
        async function getUserData() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users");
                console.log(response);
                
                const users = await response.json();
                console.log(users);
                
            } catch (error) {
                console.log(error.message);

            }
        }
        getUserData();

        // HTTP post method
        async function addUserData() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: "papan",
                        email: "a@gmail.com"
                    })
                })

                const userData = await response.json()

                console.log(userData);
            } catch (error) {
                console.log(error.message);

            }
        }
        addUserData();

        // Replace a user data(it completly replace the object with new key and value pairs)
        async function putUserData() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users/1", {
                    method: "PUT",
                    headers: {
                        "content-type": "application/json"
                    },
                    body: JSON.stringify({
                        education: "Graduation",
                        passout: true
                    })
                })
                const userData = await response.json();
                console.log(userData);

            } catch (error) {
                console.log(error.message);
            }
        }

        // Update a user data(it can update existed value of key and add new key and value pair to existed object)
        async function patchUserData() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users/1", {
                    method: "PATCH",
                    headers: {
                        "content-type": "application/json"
                    },
                    body: JSON.stringify({
                        name: "papan",
                        passout:true
                    })
                })
                const userData = await response.json();
                console.log(userData);

            } catch (error) {
                console.log(error.message);
            }
        }
        patchUserData();

        // Delete a user data
        async function deleteUser(id){
         try {
            const response=await fetch(`https://jsonplaceholder.typicode.com/users/${id}`,{
                method:"DELETE",
                
            })
            console.log(response.status);
            
         } catch (error) {
            console.log(error.message);
         }
        }
        deleteUser(2)
    </script>
</body>

</html>
