<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let MarkPercentage;

        function fun(a, b) {
            MarkPercentage = a / b * 100;
            return GradeFun(MarkPercentage);
            
        }

        fun(450, 600);

        function GradeFun(MarkPercentage) {
            if (MarkPercentage >= 70 && MarkPercentage <= 80) {
                console.log("The Student grade is C")
            }
            else if (MarkPercentage >= 80 && MarkPercentage <= 90) {
                console.log("The Student grade is B")
            }
            else {
                console.log("The Student grade is A");
            }
        }
    </script>
</body>

</html>
