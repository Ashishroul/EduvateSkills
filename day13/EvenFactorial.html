<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let TotalEven=0;

        function findEven(a) {
            for (let i = 1; i <= a; i++) {
                if (i % 2 === 0) {
                    TotalEven = TotalEven + 1;
                }
            }
            return TotalEven;
        }

        console.log(findEven(10));

        let factorial = 1;
        function Factorial(v) {
            for (let i = v; i >= 1; i--) {
                factorial = factorial * i;
            }
            return factorial;
        }
        console.log(Factorial(5));

    </script>
</body>

</html>
