<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let TotalEven=0;
        let TotalOdd=0;

        for(let i=1;i<=10;i++){
            if(i%2===0){
              TotalEven=TotalEven+1;
            }else{
                TotalOdd=TotalOdd+1;
            }
        }

        console.log(TotalEven);
        console.log(TotalOdd);
        
    </script>
</body>
</html>
