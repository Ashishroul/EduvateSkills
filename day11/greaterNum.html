<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let Num="5";
        console.log(Num + 3);

        // convert the string into Number and print the result
        console.log(Number(Num) + 3);

        let x=prompt("Enter your 1st Num")
        let y=prompt("Enter your 2nd Num")
        let z=prompt("Enter your 3rd Num")

        if(x>y && x>z){
            console.log(`The greater Num is ${x}`);
        }
        else if(y>x && y>z){
             console.log(`The greater Num is ${y}`);
        }
        else{
             console.log(`The greater Num is ${z}`);
        }
    </script>
</body>
</html>
