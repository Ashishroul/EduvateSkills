<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let prm=new Promise((resolve,reject)=>{
                console.log("in processing");

               setTimeout(()=>{
                 resolve()
               },4000)
        })

        prm.then(()=>{
          console.log("Success");
        }).catch(()=>{
            console.log("Rejected");
        })

        // check whether a number odd a even using Promise
        function oddNum(num) {
            return new Promise((resolve, reject) => {

                if (num % 2 == 0) {
                    resolve(`${num} is a even number`)
                } else if (num % 2 != 0) {
                    resolve(`${num} is a odd number`)
                }
            })
        }

        oddNum(5).then((message) => {
            console.log(message);
        }).catch(() => {
            console.log("rejected");
        })

        let prm2=Promise.resolve(5)
          
        prm2.then((num)=> num+5).then((num)=>num*2).then((num)=>num-4).then((result)=>{
            console.log(result);
        });
    </script>
</body>

</html>
